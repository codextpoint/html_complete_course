<!DOCTYPE html>
<html>
    <head>
        <title>HTML Table</title>
    </head>
    <body>
        <h1>HTML Table Tutorial</h1>
        <h2>Employee Table</h2>
        <table border="1" style="border-collapse: collapse;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last name</th>
                    <th>Salary</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>100</td>
                    <td>Mukesh</td>
                    <td>Kumar</td>
                    <td>12000</td>
                </tr>
                 <tr>
                    <td>101</td>
                    <td>Ram</td>
                    <td>Singh</td>
                    <td>15000</td>
                </tr>
                 <tr>
                    <td>102</td>
                    <td>Shyam</td>
                    <td>Singh</td>
                    <td>20000</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th>
                        Total
                    </th>
                    <th>
                        3
                    </th>
                    <th>
                        3
                    </th>
                    <th>
                       47000
                    </th>
                </tr>
            </tfoot>
        </table>

    </body>
</html>
