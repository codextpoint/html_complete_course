<!DOCTYPE html>
<html>

<head>
    <title>HTML Table</title>
</head>

<body>
    <h1>HTML Table Tutorial</h1>

    <table border="1" style="border-collapse: collapse; width: 50%;">
        <caption>
            <h2>Employee Table</2>
        </caption>

        <colgroup>
            <col span="2" style="background-color: yellow;">
            <col style="background-color: red;">
            <col style="background-color: green;">
        </colgroup>
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last name</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>100</td>
                <td>Mukesh</td>
                <td>Kumar</td>
                <td rowspan="3">20000</td>
            </tr>
            <tr>
                <td>101</td>
                <td>Ram</td>
                <td rowspan="2">Singh</td>
               
            </tr>
            <tr>
                <td>102</td>
                <td>Shyam</td>
                
                
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>
                    Total
                </th>
                <th colspan="2">
                    3
                </th>
                
                <th>
                    60000
                </th>
            </tr>
        </tfoot>
    </table>

</body>

</html>
