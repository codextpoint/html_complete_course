<!DOCTYPE html>
<html>
    <head>
        <title>LISTS</title>
    </head>
    <body>
        <h1>Unordered list</h1>
        <ul type="disc">
            <li>HTML</li>
            <li>CSS</li>
            <li>SCSS</li>
            <li>
                Javascript
                <ul style="list-style-type: square;">
                    <li>Angular</li>
                    <li>React</li>
                    <li>Jquery</li>
                    <li>Vue

                    </li>
                </ul>

            </li>
        </ul>
        <h1>Ordered list</h1>
        <ol type="1" start="5">
            <li>C programming</li>
            <li>C++</li>
            <li>C#</li>
            <li>JAVA
                <ul type="disc">
                    <li>Spring framework</li>
                    <li>Springboot</li>
                    <li>Servlet</li>
                </ul>
            </li>
        </ol>
    </body>
</html>
